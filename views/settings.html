{{ template "layout/base.html" . }}

{{define "head"}}
<title>面板设置</title>
{{end}}

{{define "body"}}
<div class="card card-default">
  <div class="card-header with-border">
    <h3 class="card-title">OpenVPN 管理面板设置</h3>
    <div class="pull-right card-tools">
      <button type="button" class="btn btn-tool" data-card-widget="collapse">
        <i class="fa fa-minus"></i></button>
    </div>
  </div>
  <!-- /.card-header -->
  <!-- form start -->
  <div class="card-body">
  {{template "common/alert.html" .}}
  <form role="form" action="{{urlfor "SettingsController.Login"}}" method="post">
    <div class="card-body">
      <!-- Disabled Profile - yet another feature to implement.
      <div class="form-group">
        <label for="name">个人资料</label>
        <input type="text" class="form-control" id="Profile" disabled
          value=" {{ .Settings.Profile }} ">
      </div>
      Disabled profile -->
      <div class="form-group">
        <label class="col-form-label" for="name">管理接口地址</label>
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-gear"></i></span>
          </div>
          <input type="text" class="form-control" id="MIAddress" title="OpenVPN 管理接口地址。"  name="MIAddress" placeholder="openvpn:2080" value="{{ .Settings.MIAddress }}">
        </div>
      </div>

      <div class="form-group">
        <label class="col-form-label" for="name">管理接口协议</label>
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fa fa-exchange"></i></span>
          </div>
          <input type="text" class="form-control" id="MINetwork" title="OpenVPN 管理接口协议。" name="MINetwork" placeholder="tcp" value="{{ .Settings.MINetwork }}">
        </div>
      </div>

      <div class="form-group">
        <label class="col-form-label" for="name">OpenVPN 配置路径</label>
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-folder"></i></span>
          </div>
          <input type="text" class="form-control" id="OVConfigPath" name="OVConfigPath" title="OpenVPN 配置目录。" placeholder="/etc/openvpn" value="{{ .Settings.OVConfigPath }}">
        </div>
      </div>

      <div class="form-group">
        <label class="col-form-label" for="name">EasyRSA 配置路径</label> <strong><span style="color:#337ab7" title="此版本为新格式">!</span></strong>
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-folder"></i></span>
          </div>
          <input type="text" class="form-control" id="EasyRSAPath" name="EasyRSAPath" title="EasyRSA 配置目录。" placeholder="/usr/share/easy-rsa" value="{{ .Settings.EasyRSAPath }}">
        </div>
      </div>

      {{ .xsrfdata }}

      <button type="submit" class="btn btn-primary" style="width: 125px;">保存配置</button>  
    </div>
        <!-- /.card-body -->
  </form>
</div>  
</div>
<!-- /.card -->
{{end}}
