<ul class="navbar-nav">

  <li {{if compare .RouterPattern "/"}}class="nav-item"{{end}}>
    <a href="{{urlfor "MainController.Get"}}" class="nav-link">首页 <span class="sr-only">（当前）</span></a>
  </li>


{{ if .Userinfo.IsAdmin }}
  <li class="dropdown">
    <a href="#" class="nav-link dropdown-toggle" data-toggle="dropdown">
      配置 </a>

    <ul class="dropdown-menu" role="menu">
      <li {{if compare .RouterPattern "/settings"}}class="dropdown-item"{{end}}>
        <a href="{{urlfor "SettingsController.Get"}}" class="dropdown-item">OpenVPN 管理面板</a>
      </li>

      <li {{if compare .RouterPattern "/ov/config"}}class="dropdown-item"{{end}}>
        <a href="{{urlfor "OVConfigController.Get"}}" class="dropdown-item">OpenVPN 服务端</a>
      </li>

      <li {{if compare .RouterPattern "/ov/clientconfig"}}class="dropdown-item"{{end}}>
        <a href="{{urlfor "OVClientConfigController.Get"}}" class="dropdown-item">OpenVPN 客户端</a>
      </li>

      <li {{if compare .RouterPattern "/easyrsa/config"}}class="dropdown-item"{{end}}>
        <a href="{{urlfor "EasyRSAConfigController.Get"}}" class="dropdown-item">EasyRSA 变量</a>
      </li>

      <li {{if compare .RouterPattern "/dangerzone"}}class="dropdown-item"{{end}}>
        <a href="{{urlfor "DangerController.Get"}}" class="dropdown-item">维护</a>
      </li>
    </ul>
  </li>
  {{ else }}
  {{ end }}


  <li {{if compare .RouterPattern "/certificates"}}class="nav-item"{{end}}>
    <a href="{{urlfor "CertificatesController.Get"}}" class="nav-link">证书</a>
  </li>

  <li {{if compare .RouterPattern "/logs"}}class="nav-item"{{end}}>
    <a href="{{urlfor "LogsController.Get"}}" class="nav-link">日志</a>
  </li>
</ul>
