<!-- Messages: style can be found in dropdown.less-->
<li class="dropdown messages-menu">
  <!-- Menu toggle button -->
  <a href="#" class="dropdown-toggle" data-toggle="dropdown">
    <i class="fa fa-envelope-o"></i>
    <span class="label label-success">4</span>
  </a>
  <ul class="dropdown-menu">
    <li class="header">你有 4 条消息</li>
    <li>
      <!-- inner menu: contains the messages -->
      <ul class="menu">
        <li><!-- start message -->
          <a href="#">
            <div class="pull-left">
              <!-- User Image -->
              <img src="/static/img/person.png" class="img-circle" alt="User Image">
            </div>
            <!-- Message title and timestamp -->
            <h4>
              支持团队
              <small><i class="fa fa-clock-o"></i> 5 分钟前</small>
            </h4>
            <!-- The message -->
            <p>为什么不换个更酷的主题？</p>
          </a>
        </li>
        <!-- end message -->
      </ul>
      <!-- /.menu -->
    </li>
    <li class="footer"><a href="#">查看全部消息</a></li>
  </ul>
</li>
<!-- /.messages-menu -->
<!-- Notifications Menu -->
<li class="dropdown notifications-menu">
  <!-- Menu toggle button -->
  <a href="#" class="dropdown-toggle" data-toggle="dropdown">
    <i class="fa fa-bell-o"></i>
    <span class="label label-warning">10</span>
  </a>
  <ul class="dropdown-menu">
    <li class="header">你有 10 条通知</li>
    <li>
      <!-- Inner Menu: contains the notifications -->
      <ul class="menu">
        <li><!-- start notification -->
          <a href="#">
            <i class="fa fa-users text-aqua"></i> 今天新增 5 位成员
          </a>
        </li>
        <!-- end notification -->
      </ul>
    </li>
    <li class="footer"><a href="#">查看全部</a></li>
  </ul>
</li>

<!-- Tasks Menu -->
<li class="dropdown tasks-menu">
  <!-- Menu Toggle Button -->
  <a href="#" class="dropdown-toggle" data-toggle="dropdown">
    <i class="fa fa-flag-o"></i>
    <span class="label label-danger">9</span>
  </a>
  <ul class="dropdown-menu">
    <li class="header">你有 9 项任务</li>
    <li>
      <!-- Inner menu: contains the tasks -->
      <ul class="menu">
        <li><!-- Task item -->
          <a href="#">
            <!-- Task title and progress text -->
            <h3>
              设计一些按钮
              <small class="pull-right">20%</small>
            </h3>
            <!-- The progress bar -->
            <div class="progress xs">
              <!-- Change the css width attribute to simulate progress -->
              <div class="progress-bar progress-bar-aqua" style="width: 20%" role="progressbar" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100">
                <span class="sr-only">完成 20%</span>
              </div>
            </div>
          </a>
        </li>
        <!-- end task item -->
      </ul>
    </li>
    <li class="footer">
      <a href="#">查看全部任务</a>
    </li>
  </ul>
</li>
